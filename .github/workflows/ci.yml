name: Verify Bunker
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:dependencies
      - run: cargo test -p winterwallet-core --locked
      - run: cargo check -p bunker --locked
      - run: npm run source:bundle
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser release checks
        run: |
          npm start > /tmp/bunker-preview.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          npm run test:e2e
