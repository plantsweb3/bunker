name: Verify Bunker
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          # Pinned so a new compiler release cannot change what is tested.
          toolchain: 1.99.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:dependencies
      - run: cargo test --workspace --locked
      - run: npx tsx scripts/v3-vectors.ts > /tmp/bunker-v3.json
      - run: diff fixtures/bunker-v3.json /tmp/bunker-v3.json
      # A third implementation, in Python from the specification alone, must
      # reproduce the same vectors.
      - run: python3 scripts/independent-check.py
      - run: npm run source:bundle
      - name: Offline recovery tool builds reproducibly
        run: |
          cp public/source/bunker-recovery-tool.html /tmp/tool-first.html
          npm run tool:build
          cmp /tmp/tool-first.html public/source/bunker-recovery-tool.html
          cat public/source/recovery-tool-manifest.json
      # An independent build of the tool, so its hash does not rest only on
      # the copy the website serves. Only for commits on main: a pull request
      # from a fork must not be able to publish an artifact under this name.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: bunker-recovery-tool
          path: |
            public/source/bunker-recovery-tool.html
            public/source/recovery-tool-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Command-line client builds reproducibly
        run: |
          cp public/source/bunker-cli.mjs /tmp/cli-first.mjs
          npm run cli:build
          cmp /tmp/cli-first.mjs public/source/bunker-cli.mjs
          cat public/source/cli-manifest.json
          # The single file runs on its own, away from the repository.
          mkdir /tmp/cli-alone && cp public/source/bunker-cli.mjs /tmp/cli-alone/
          (cd /tmp/cli-alone && node bunker-cli.mjs help)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: bunker-cli
          path: |
            public/source/bunker-cli.mjs
            public/source/cli-manifest.json
          if-no-files-found: error
          retention-days: 90
      - run: npm run build
  # The compiled program, exercised in an in-process VM: every instruction,
  # the vault-isolation attacks, and the client's own bytes.
  program-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOLANA_VERSION: 4.3.0
      SOLANA_SHA256: c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8
      PLATFORM_TOOLS_VERSION: v1.57
      PLATFORM_TOOLS_SHA256: b0f7af104adf726fff2a6a09ea2eb2f2d2965c92295f4d7388c08d140e0c2b00
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0
      # Both archives are fetched by exact version and checked against a
      # recorded SHA-256 before anything in them runs. The Solana archive's
      # hash was taken from two sources (release.anza.xyz and the GitHub
      # release) and they agreed.
      - name: Install the Solana build tools, verified
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/solana.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "${SOLANA_SHA256}  /tmp/solana.tar.bz2" | sha256sum -c -
          mkdir -p "$HOME/solana" && tar -xjf /tmp/solana.tar.bz2 -C "$HOME/solana"
          echo "$HOME/solana/solana-release/bin" >> "$GITHUB_PATH"
      - name: Install the SBF platform tools, verified
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/platform-tools.tar.bz2 \
            "https://github.com/anza-xyz/platform-tools/releases/download/${PLATFORM_TOOLS_VERSION}/platform-tools-linux-x86_64.tar.bz2"
          echo "${PLATFORM_TOOLS_SHA256}  /tmp/platform-tools.tar.bz2" | sha256sum -c -
          mkdir -p "$HOME/.cache/solana/${PLATFORM_TOOLS_VERSION}/platform-tools"
          tar -xjf /tmp/platform-tools.tar.bz2 -C "$HOME/.cache/solana/${PLATFORM_TOOLS_VERSION}/platform-tools"
      - run: cargo-build-sbf --version
      - name: Build the program
        run: |
          cargo-build-sbf --manifest-path programs/bunker3/Cargo.toml --sbf-out-dir target/deploy 2>&1 | tee /tmp/build.log
          # The verified tools above must be the ones used: nothing fetched here.
          ! grep -qi "downloading platform-tools\|Downloading https" /tmp/build.log
      - run: sha256sum target/deploy/bunker3.so | tee target/deploy/bunker3.so.sha256
      # Test only: a program that forwards instructions, for the cross-program tests.
      - run: cargo-build-sbf --manifest-path programs/bunker3-cpi-probe/Cargo.toml --sbf-out-dir target/deploy
      # The program as built by this pinned, verified toolchain, kept so its
      # hash does not rest on anyone's own machine.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: bunker3-program
          path: |
            target/deploy/bunker3.so
            target/deploy/bunker3.so.sha256
          if-no-files-found: error
          retention-days: 90
      - run: cargo test --locked
        working-directory: programs/bunker3-svm-tests
  # The program built the way a deployment would be: by solana-verify, inside
  # its container image for the Solana version in Cargo.toml. Built twice from
  # two separate checkouts; the two must be byte for byte the same. Nothing is
  # deployed from here.
  verified-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLANA_VERIFY_VERSION: 0.5.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ env.SOLANA_VERIFY_VERSION }}-${{ runner.os }}
      - name: Install solana-verify
        run: command -v solana-verify || cargo install solana-verify --locked --version "${SOLANA_VERIFY_VERSION}"
      - name: Build in the pinned container
        run: |
          solana-verify build --library-name bunker3
          solana-verify get-executable-hash target/deploy/bunker3.so | tee /tmp/first.hash
      - name: Build again from a separate checkout
        run: |
          git clone --no-hardlinks . /tmp/second
          cd /tmp/second
          solana-verify build --library-name bunker3
          solana-verify get-executable-hash target/deploy/bunker3.so | tee /tmp/second.hash
      - name: The two builds are identical
        run: |
          cmp target/deploy/bunker3.so /tmp/second/target/deploy/bunker3.so
          cmp /tmp/first.hash /tmp/second.hash
          # The container writes target/ as root, so the results are kept elsewhere.
          mkdir /tmp/verified
          cp target/deploy/bunker3.so /tmp/verified/bunker3.so
          (cd /tmp/verified && sha256sum bunker3.so | tee bunker3.so.sha256)
          cp /tmp/first.hash /tmp/verified/bunker3.executable-hash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: bunker3-program-verified-build
          path: |
            /tmp/verified/bunker3.so
            /tmp/verified/bunker3.so.sha256
            /tmp/verified/bunker3.executable-hash
          if-no-files-found: error
          retention-days: 90
  browser-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      # Official Playwright 1.56.1 Noble image, matched to package-lock.json.
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run source:bundle
      - run: npm run build
      - name: Browser release checks
        run: |
          npm start > /tmp/bunker-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          npm run test:e2e
