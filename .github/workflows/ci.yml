name: Verify Bunker
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:dependencies
      - run: cargo test --workspace --locked
      - run: npx tsx scripts/v3-vectors.ts > /tmp/bunker-v3.json
      - run: diff fixtures/bunker-v3.json /tmp/bunker-v3.json
      - run: npm run source:bundle
      - name: Offline recovery tool builds reproducibly
        run: |
          cp public/source/bunker-recovery-tool.html /tmp/tool-first.html
          npm run tool:build
          cmp /tmp/tool-first.html public/source/bunker-recovery-tool.html
          cat public/source/recovery-tool-manifest.json
      # An independent build of the tool, so its hash does not rest only on
      # the copy the website serves.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunker-recovery-tool
          path: |
            public/source/bunker-recovery-tool.html
            public/source/recovery-tool-manifest.json
          if-no-files-found: error
          retention-days: 90
      - run: npm run build
  browser-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      # Official Playwright 1.56.1 Noble image, matched to package-lock.json.
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run source:bundle
      - run: npm run build
      - name: Browser release checks
        run: |
          npm start > /tmp/bunker-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          npm run test:e2e
