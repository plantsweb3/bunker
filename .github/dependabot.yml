version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
  # The VM test crate has its own lockfile.
  - package-ecosystem: cargo
    directory: /programs/bunker3-svm-tests
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
