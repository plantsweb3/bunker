[package]
name = "bunker-lmots"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Verification of LM-OTS one-time signatures (RFC 8554, LMOTS_SHA256_N32_W8) for on-chain use."

[lints]
workspace = true

[lib]

[features]
# Key generation and signing, for tests. The program verifies only.
signer = []

[dependencies]
solana-sha256-hasher = { workspace = true }

[target.'cfg(not(any(target_arch = "bpf", target_os = "solana")))'.dependencies]
solana-sha256-hasher = { workspace = true, features = ["sha2"] }
