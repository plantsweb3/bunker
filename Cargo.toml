[workspace]
resolver = "2"
members = ["programs/bunker3", "crates/bunker-lmots"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Bunker contributors"]
[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(target_arch, values("bpf"))'] }
[workspace.dependencies]
solana-sha256-hasher = { version = "3.1.0", default-features = false }
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
