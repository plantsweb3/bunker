[workspace]
resolver = "2"
members = ["programs/bunker", "crates/winterwallet-core"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Bunker contributors"]
[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(target_arch, values("bpf"))'] }
[workspace.dependencies]
solana-sha256-hasher = { version = "3.1.0", default-features = false }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
